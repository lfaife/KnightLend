# Fixed project name: every checkout reuses the same MongoDB container and data volume.
name: knightlend

services:
  mongo:
    image: mongo:7.0
    container_name: knightlend-mongo
    ports:
      - "27017:27017"
    volumes:
      - knightlend-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knightlend-mongo:
