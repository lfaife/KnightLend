<title>KnightLend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky app bar over a centered 1120px column. Money has two visual languages:
   charged = solid ink, held = dashed amber outline. They never share a style. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF3; --ink:#131A2B; --muted:#576079;
  --line:#DAE0EA; --line-strong:#B9C2D3;
  --accent:#2B44C4; --accent-hover:#2238A8; --accent-soft:#E5E9FB; --on-accent:#FFFFFF;
  --hold:#875400; --hold-bg:#FFF4D8; --hold-line:#D69A2D;
  --ok:#17734A; --ok-bg:#E2F3E9; --bad:#B42318; --bad-bg:#FDE8E5; --pend:#5A6378; --pend-bg:#EDF0F5;
  --tile-s:55%; --tile-l:91%; --tile-ink:34%;
  --shadow:0 16px 40px rgb(19 26 43 / .14);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#161D2D; --sunk:#1E2638; --ink:#E8ECF5; --muted:#9CA5BB;
    --line:#29324A; --line-strong:#3E4964;
    --accent:#8FA3FF; --accent-hover:#A9B8FF; --accent-soft:#232D52; --on-accent:#0E1430;
    --hold:#F2C66B; --hold-bg:#30260F; --hold-line:#A8802F;
    --ok:#62CC97; --ok-bg:#12291F; --bad:#FF8A7E; --bad-bg:#3A1A18; --pend:#A5AEC4; --pend-bg:#222A3D;
    --tile-s:28%; --tile-l:21%; --tile-ink:78%;
    --shadow:0 16px 40px rgb(0 0 0 / .45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2D; --sunk:#1E2638; --ink:#E8ECF5; --muted:#9CA5BB;
  --line:#29324A; --line-strong:#3E4964;
  --accent:#8FA3FF; --accent-hover:#A9B8FF; --accent-soft:#232D52; --on-accent:#0E1430;
  --hold:#F2C66B; --hold-bg:#30260F; --hold-line:#A8802F;
  --ok:#62CC97; --ok-bg:#12291F; --bad:#FF8A7E; --bad-bg:#3A1A18; --pend:#A5AEC4; --pend-bg:#222A3D;
  --tile-s:28%; --tile-l:21%; --tile-ink:78%;
  --shadow:0 16px 40px rgb(0 0 0 / .45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.012em}
h1{font-size:clamp(1.75rem,4vw,2.5rem);font-weight:750}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.05rem;font-weight:650}
h1:focus{outline:none}
p{margin:0}
ul,ol{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{padding-block:24px 72px;display:grid;gap:20px}
.narrow{max-width:1000px}
.muted{color:var(--muted)}
.hint{font-size:.84rem;color:var(--muted)}
.center{text-align:center}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.flabel,.field label{font-size:.82rem;font-weight:650;color:var(--ink)}
.mini-label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.h-page{font-size:clamp(1.6rem,3.4vw,2.1rem)}
.h-sec{font-size:1.1rem;margin-top:8px}
.h-small{font-size:1rem;font-weight:700}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* proto strip + header */
.proto{background:var(--sunk);color:var(--muted);font-size:.8rem}
.proto .wrap{padding-block:6px}
.proto b{color:var(--ink);font-weight:650}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;min-height:60px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.22rem;letter-spacing:-.02em;color:var(--ink)}
.brand svg{color:var(--accent)}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button.on{color:var(--ink);background:var(--accent-soft)}
.top-actions{display:flex;gap:8px;align-items:center}
.bell{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.bell .count{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:var(--surface);font-size:.7rem;font-weight:700;display:grid;place-items:center}
@media (max-width:720px){
  .top-in{flex-wrap:wrap;row-gap:4px;padding-block:8px}
  .brand{margin-right:auto}
  .nav{order:3;flex-basis:100%}
}
.notifs{position:absolute;left:0;right:0;top:100%}
.notif-panel{margin:8px 0 0 auto;width:min(390px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:grid;gap:4px}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 4px}
.notif{display:grid;gap:2px;text-align:left;background:none;border:0;border-left:3px solid var(--line);border-radius:6px;padding:9px 10px;cursor:pointer}
.notif:hover{background:var(--sunk)}
.notif span{font-size:.86rem;color:var(--muted)}
.notif time{font-size:.74rem;color:var(--muted);font-family:var(--f-mono)}
.n-hold{border-left-color:var(--hold-line)} .n-bad{border-left-color:var(--bad)} .n-ok{border-left-color:var(--ok)} .n-info{border-left-color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:10px 16px;font-weight:650;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:7px 12px;font-size:.87rem}
.btn-block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.back{justify-self:start;background:none;border:0;padding:0;color:var(--muted);font-weight:600;cursor:pointer}
.back:hover{color:var(--ink)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.77rem;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent;line-height:1.35}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.b-pend{background:var(--pend-bg);color:var(--pend);border:1px dashed var(--pend)}
.b-active{background:var(--hold-bg);color:var(--hold);border:1px dashed var(--hold-line)}
.b-rel{background:var(--ok-bg);color:var(--ok)}
.b-cap{background:var(--bad-bg);color:var(--bad)}
.b-fail{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.b-soft{background:var(--sunk);color:var(--muted)}
.b-review{background:var(--accent-soft);color:var(--accent)}

/* money vocabulary */
.held-amt{color:var(--hold);font-weight:700;font-variant-numeric:tabular-nums}
.tag-held{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--hold);background:var(--hold-bg);border:1px dashed var(--hold-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.hold-mini{font-size:.8rem;font-weight:600;color:var(--hold);white-space:nowrap}
.holdbox{display:flex;align-items:flex-start;gap:10px;background:var(--hold-bg);border:1.5px dashed var(--hold-line);border-radius:11px;padding:12px}
.holdbox-ico{color:var(--hold);flex:none;margin-top:1px}
.holdbox p{flex:1;min-width:0}
.holdbox b{color:var(--hold)}
.tip{position:relative;flex:none}
.tip-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--hold);background:transparent;color:var(--hold);font:700 12px/1 var(--f-mono);cursor:pointer;display:grid;place-items:center;padding:0}
.tip-pop{position:absolute;right:-6px;bottom:calc(100% + 8px);width:min(260px,72vw);background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:9px;font-size:.84rem;line-height:1.45;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .15s,transform .15s,visibility .15s;z-index:6}
.tip:hover .tip-pop,.tip-btn:focus-visible + .tip-pop,.tip.open .tip-pop{opacity:1;visibility:visible;transform:none}
.sum{display:grid;gap:8px;font-size:.93rem}
.sum-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sum-row > span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-total{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.sum-hold{border:1.5px dashed var(--hold-line);background:var(--hold-bg);border-radius:10px;padding:10px 12px;display:grid;gap:3px;margin-top:4px}
.sum-row.cap > span:last-child{color:var(--bad);font-weight:700}

/* panels, alerts, demo controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:20px;display:grid;gap:16px}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:11px;padding:12px 14px;border:1px solid var(--line)}
.alert > div{display:grid;gap:4px;min-width:0}
.alert-bad{background:var(--bad-bg);border-color:var(--bad)}
.alert-bad b{color:var(--bad)}
.alert-hold{background:var(--hold-bg);border:1.5px dashed var(--hold-line)}
.alert-hold b{color:var(--hold)}
.alert-ok{background:var(--ok-bg);border-color:var(--ok)}
.alert-ok b{color:var(--ok)}
.alert-ico{flex:none;margin-top:2px}
.alert-bad .alert-ico{color:var(--bad)} .alert-hold .alert-ico{color:var(--hold)} .alert-ok .alert-ico{color:var(--ok)}
.note{font-size:.86rem;color:var(--muted)}
.demo{border:1.5px dashed var(--line-strong);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.demo-label{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.demo-btns{display:flex;flex-wrap:wrap;gap:8px}
.role{justify-self:start;display:inline-flex;font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.role.lender{background:var(--accent-soft);color:var(--accent)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* forms */
.field{display:grid;gap:6px}
input[type="text"],input[type="search"],input[type="number"],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical}
input[type="range"]{width:100%;accent-color:var(--accent)}
.check,.radio{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input,.radio input{margin-top:4px;accent-color:var(--accent)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
.opt{display:grid;gap:8px}
.opt label{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.opt label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--muted);font-size:.84rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.cardform{display:grid;gap:14px}
.ccwrap{position:relative}
.cc-brand{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 .76rem var(--f-mono);color:var(--muted);pointer-events:none}
#cc-num,#cc-exp,#cc-cvc,#cc-zip{font-family:var(--f-mono);letter-spacing:.03em}
.testcards{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.testcards button{font:500 .76rem var(--f-mono);border:1px dashed var(--line-strong);background:var(--bg);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink)}
.testcards button:hover{border-color:var(--ink)}
.err-text{color:var(--bad);font-size:.86rem;font-weight:600}

/* browse */
.intro{padding-block:36px 26px;display:grid;gap:10px}
.intro h1{max-width:20ch}
.lede{max-width:62ch;color:var(--muted);font-size:1.04rem}
.browse{display:grid;grid-template-columns:236px minmax(0,1fr);gap:28px;padding-block:4px 72px}
.filters{display:grid;gap:20px;align-content:start;position:sticky;top:84px}
.fgroup{display:grid;gap:8px}
.flabel-row{display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (max-width:860px){.browse{grid-template-columns:1fr}.filters{position:static}}
.results{display:grid;gap:12px;align-content:start;min-width:0}
.results-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.lcard{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;padding:0;transition:border-color .15s,transform .15s}
button.lcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile{background:hsl(var(--h) var(--tile-s) var(--tile-l));color:hsl(var(--h) 45% var(--tile-ink))}
.lcard .tile{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center}
.lcard-body{display:flex;flex-direction:column;gap:3px;padding:12px 14px 14px;flex:1}
.lcard-title{font-weight:650;line-height:1.3}
.lcard-meta{font-size:.82rem;color:var(--muted)}
.lcard-foot{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:auto;padding-top:8px}
.price b{font-family:var(--f-display);font-size:1.15rem}
.price{font-size:.85rem;color:var(--muted)}
.price b{color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-strong);border-radius:14px}

/* listing detail */
.ld{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:start}
.ld-main{display:grid;gap:14px}
.ld-media{aspect-ratio:16/10;max-width:100%;border-radius:16px;display:grid;place-items:center}
.ld-title{font-size:clamp(1.5rem,3vw,2rem)}
.ld-desc{max-width:62ch}
.facts{display:grid;gap:0;margin:0;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:.88rem}
.facts dd{margin:0}
.book{padding:20px;display:grid;gap:16px;position:sticky;top:84px}
.book-price{font-size:.95rem;color:var(--muted)}
.book-price b{font-family:var(--f-display);font-size:1.7rem;color:var(--ink)}
.days{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.days-dates{font-size:.9rem}
.stepper-num{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.stepper-num button{width:36px;height:36px;border:0;background:var(--surface);cursor:pointer;font-size:1.1rem}
.stepper-num button:disabled{opacity:.35;cursor:not-allowed}
.stepper-num span{min-width:66px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.cancel{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.cancel ul{padding-left:18px;display:grid;gap:5px;font-size:.86rem;color:var(--muted)}
.cancel b{color:var(--ink);font-weight:600}
@media (max-width:860px){.ld{grid-template-columns:1fr}.book{position:static}}
@media (max-width:520px){.facts div{grid-template-columns:1fr;gap:2px}}

/* request flow */
.steps{list-style:none;padding:0;display:flex;gap:6px;overflow-x:auto}
.steps li{flex:1;min-width:112px;display:flex;align-items:center;gap:8px;padding-top:10px;border-top:3px solid var(--line);color:var(--muted);font-size:.85rem;font-weight:600}
.steps li.done{border-color:var(--ok);color:var(--ink)}
.steps li.cur{border-color:var(--accent);color:var(--ink)}
.steps li.err{border-color:var(--bad)}
.steps-n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:.74rem;flex:none}
.steps li.done .steps-n{background:var(--ok);color:var(--surface)}
.steps li.cur .steps-n{background:var(--accent);color:var(--on-accent)}
.steps li.err .steps-n{background:var(--bad);color:var(--surface)}
.req-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.req-main{display:grid;gap:16px}
.req-side{padding:18px;display:grid;gap:14px;position:sticky;top:84px}
@media (max-width:860px){.req-grid{grid-template-columns:1fr}.req-side{position:static;order:-1}}
.mini{display:flex;gap:12px;align-items:center}
.mini > div{min-width:0}
.tile.sm{width:52px;height:52px;border-radius:11px;display:grid;place-items:center;flex:none}
.mini-title{font-weight:650;line-height:1.3}
.mini-sub{font-size:.84rem;color:var(--muted)}
.wait-row{display:flex;gap:14px;align-items:flex-start}
.kv{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:.92rem}
.agree{padding-left:20px;display:grid;gap:10px;max-width:68ch}
.agree li::marker{color:var(--muted);font-weight:600}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd{border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.bd-charge{background:var(--sunk);border:1px solid var(--line)}
.bd-hold{background:var(--hold-bg);border:1.5px dashed var(--hold-line)}
.bd-amt{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.bd-sub{font-size:.8rem;color:var(--muted)}
.bd-hold .bd-amt,.bd-hold .mini-label{color:var(--hold)}
.plain{font-size:.95rem;border-left:3px solid var(--line-strong);padding-left:10px}
@media (max-width:420px){.breakdown{grid-template-columns:1fr}}
.success{display:grid;gap:14px;justify-items:start}
.success-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.success-ico.bad{background:var(--bad-bg);color:var(--bad)}
.success .money2{width:100%}

/* rentals */
.rlist{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer}
.rrow:hover{border-color:var(--accent)}
.rrow-main{display:grid;gap:2px;min-width:0}
.rrow-title{font-weight:650}
.rrow-sub{font-size:.85rem;color:var(--muted)}
.rrow-money{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.rrow-money > span{display:grid;justify-items:end}
.rrow-badges{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
@media (max-width:760px){
  .rrow{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
  .rrow-money,.rrow-badges{grid-column:2}
  .rrow-money > span{justify-items:start}
  .rrow-badges{flex-direction:row;flex-wrap:wrap;align-items:center}
}
.rd-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rd-head .tile.sm{width:64px;height:64px}
.rd-head > div{flex:1;min-width:220px;display:grid;gap:4px}
.money2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcol{border-radius:13px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);display:grid;gap:6px;align-content:start}
.mcol.held{background:var(--hold-bg);border:1.5px dashed var(--hold-line)}
.mcol.held .mini-label,.mcol.held .mbig{color:var(--hold)}
.mbig{font-family:var(--f-display);font-size:1.75rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.mcol .sum{font-size:.88rem}
@media (max-width:560px){.money2{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
details.agreement{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px}
details.agreement summary{cursor:pointer;font-weight:650}
details.agreement[open] summary{margin-bottom:12px}

/* timeline */
.tl{list-style:none;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:64px 18px minmax(0,1fr);gap:10px;align-items:start;position:relative;padding-bottom:16px}
.tl li:not(:last-child)::after{content:"";position:absolute;left:82px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl time{font-size:.78rem;color:var(--muted);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.tl .dot{width:12px;height:12px;border-radius:50%;margin:5px auto 0;background:var(--surface);border:2px solid var(--line-strong);position:relative;z-index:1}
.tl li.done .dot{background:var(--ok);border-color:var(--ok)}
.tl li.next .dot{border-style:dashed}
.tl li.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl li.fail .dot,.tl li.cap .dot{background:var(--bad);border-color:var(--bad)}
.tl b{display:block;font-weight:650}
.tl li.fail b,.tl li.cap b{color:var(--bad)}
.tl .x{display:block;color:var(--muted);font-size:.87rem}

/* return flow */
.holdbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--hold-bg);border:1.5px dashed var(--hold-line);border-radius:11px;padding:10px 14px;color:var(--hold);font-weight:600}
.holdbar.released{background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok)}
.holdbar.captured{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad)}
.holdbar .spacer{flex:1}
.ph-row{display:flex;flex-wrap:wrap;gap:10px}
.ph{margin:0;display:grid;gap:4px;width:118px;position:relative}
.ph-img{width:118px;height:88px;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.ph img{width:118px;height:88px;object-fit:cover;border-radius:10px;display:block}
.ph figcaption{font-size:.74rem;color:var(--muted)}
.ph-mark{position:absolute;left:60%;top:16%;width:30px;height:30px;border:2.5px solid var(--bad);border-radius:50%}
.ph-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:.8rem;cursor:pointer;line-height:1}
.ph-add{position:relative;width:118px;height:88px;border:1.5px dashed var(--line-strong);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;padding:6px}
.ph-add:hover{border-color:var(--ink);color:var(--ink)}
.ph-add:focus-within{outline:2.5px solid var(--accent);outline-offset:2px}
.ph-add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.evi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.evi > div{display:grid;gap:8px;align-content:start}
@media (max-width:640px){.evi{grid-template-columns:1fr}}
.claimcard{display:grid;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.claimcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:.92rem}
.claimcard dt{color:var(--muted)}
.claimcard dd{margin:0}
.quote{border-left:3px solid var(--line-strong);padding-left:10px;font-style:italic;color:var(--muted)}
.amt-row{display:flex;gap:14px;align-items:center}
.amt-row output{min-width:56px;text-align:right;font-family:var(--f-display);font-size:1.3rem}

/* dashboard */
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;justify-self:start}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:14px 16px;display:grid;gap:4px;align-content:start}

.stat-n{font-family:var(--f-display);font-size:1.8rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.held .stat-n,.stat.held .mini-label{color:var(--hold)}
.stat.rel .stat-n{color:var(--ok)}
.stat.cap .stat-n{color:var(--bad)}
.stat p{font-size:.82rem;color:var(--muted)}
.hbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);gap:2px}
.hbar span{display:block;height:100%}
.s-held{background:repeating-linear-gradient(45deg,var(--hold-line) 0 5px,var(--hold-bg) 5px 9px)}

.s-cap{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.84rem;color:var(--muted)}

.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;min-width:640px;font-size:.92rem}

.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* create */
.create{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.create-prev{display:grid;gap:12px;position:sticky;top:84px}
.create-prev .lcard{cursor:default;max-width:320px}
.hold-set{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.amt-big{font-family:var(--f-display);font-size:1.4rem}
.tiers{width:100%;border-collapse:collapse;font-size:.88rem}
.tiers th,.tiers td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.tiers th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tiers tr.on td{background:var(--hold-bg);color:var(--hold);font-weight:650}

/* safety */

.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vs > div{border-radius:13px;padding:16px;display:grid;gap:8px;align-content:start}
.vs ul{padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.vs .c{background:var(--surface);border:1px solid var(--line)}
.vs .hh{background:var(--hold-bg);border:1.5px dashed var(--hold-line)}

.faq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.faq > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start}

/* ---------- protection hold rules ---------- */
function holdRange(v){
  if (v < 50) return {min:5, max:15, label:'under $50', key:0};
  if (v < 150) return {min:25, max:50, label:'$50 to $150', key:1};
  return {min:75, max:150, label:'$150 and up', key:2};
}
function suggestHold(v){
  const r = holdRange(v);
  const t = v < 50 ? v / 50 : v < 150 ? (v - 50) / 100 : Math.min(v - 150, 150) / 150;
  return clamp(Math.round((r.min + t * (r.max - r.min)) / 5) * 5, r.min, r.max);
}
// Holds last about 7 days; schedule a refresh every 7 days until the return date.
function refreshPlan(placed, end){
  const out = []; let exp = addDays(placed, 7);
  while (exp < end) { out.push({date: iso(exp), state: 'scheduled'}); exp = addDays(exp, 7); }

function placeHold(ctx){
  const c = S.card;
  c.name = $('#cc-name').value.trim(); c.exp = $('#cc-exp').value.trim(); c.cvc = $('#cc-cvc').value.trim(); c.zip = $('#cc-zip').value.trim();
  const t = TEST_CARDS[c.num];
  c.err = '';
  if (!c.name) c.err = 'Enter the name on the card.';
  else if (!t) c.err = c.num.length < 15 ? 'Enter a card number. Use one of the fake test cards below.' : 'That isn’t one of the test cards. This prototype only accepts the fake numbers below, so please don’t enter a real card.';
  else if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(c.exp)) c.err = 'Enter the expiry date as MM/YY.';
  else if (!/^\d{3,4}$/.test(c.cvc)) c.err = 'Enter the 3-digit security code from the back of the card.';
  if (c.err) { c.status = 'idle'; render(); return; }
  c.status = 'processing'; render();
  setTimeout(() => {
    if (!t.ok) { c.status = 'declined'; render(); return; }
    c.status = 'ok';
    if (ctx === 'request') completeRequest(); else completeCardUpdate();
    render();
  }, 1100);
}

function timelineHTML(r){
  const h = r.hold, l = lst(r.lid), end = endOf(r), ev = [];
  if (h.status === 'pending') {
    return `<ol class="tl"><li class="now"><time>Now</time><span class="dot"></span><div><b>Waiting for ${first(l.lender)}</b><span class="x">Nothing is charged or held yet.</span></div></li>
      <li class="next"><time>Next</time><span class="dot"></span><div><b>You place the hold</b><span class="x">${usd0(h.amount)} held, not charged, after approval.</span></div></li></ol>`;
  }
  const st = d => same(d, TODAY) ? 'now' : d < TODAY ? 'done' : 'next';
  ev.push({d:D(h.placed), t:'Hold placed', x:`${usd0(h.amount)} held, not charged. Lasts about 7 days.`, s:'done'});
  (h.refreshes || []).forEach(f => {
    const d = D(f.date), rem = addDays(d, -1);
    if (!f.fixed) ev.push({d:rem, t:'Reminder sent', x:'“Your hold renews tomorrow. No charge.”', s: rem <= TODAY ? 'done' : 'next'});
    if (f.state === 'done') ev.push({d, t:'Hold refreshed', x: f.fixed ? 'After your card update. No charge.' : 'No charge. Same amount, new expiry.', s:'done'});
    else if (f.state === 'failed') ev.push({d, t:'Hold refresh failed', x:'Your card declined the renewal. Nothing was charged.', s:'fail'});
    else ev.push({d, t:'Hold refresh', x:'Automatic. No charge.', s:'next'});
  });
  if (r.phase === 'returned') {
    ev.push({d:D(r.returnedOn), t: r.notReturned ? 'Claim closed' : 'Returned', x: r.notReturned ? 'Item marked as not returned.' : `At ${l.spot}.`, s:'done'});
    if (h.status === 'released') ev.push({d:D(h.released), t:'Hold released', x:'Nothing was charged.', s:'done'});
    else ev.push({d:D(h.released), t:`Hold captured: ${usd0(h.captured)}`, x: h.amount > h.captured ? `The other ${usd0(h.amount - h.captured)} was released.` : 'The full hold was charged.', s:'cap'});
  } else {
    ev.push({d:end, t:'Return due', x:`Bring it to ${l.spot}.`, s: st(end)});
    ev.push({d:addDays(end,3), t:'Hold released', x:'Within 3 days of a clean return.', s:'next'});
  }
  ev.sort((a, b) => a.d - b.d);
  return `<ol class="tl">${ev.map(e => `<li class="${e.s}"><time>${fmtD(e.d)}</time><span class="dot"></span><div><b>${e.t}</b><span class="x">${esc(e.x)}</span></div></li>`).join('')}</ol>`;
}

function settleRefresh(r){

function completeCardUpdate(){

    body = `<div class="panel pad success">
      <span class="success-ico ${cap ? 'bad' : ''}">${cap ? ico.alert : ico.check}</span>
      ${holdBadge(h)}
      <h2>${cap ? `Hold captured: ${usd0(Z)}` : 'Hold released'}</h2>
      ${cap ? '' : `<p style="font-size:1.1rem"><b>Your ${H} hold has been released.</b></p>`}
      <p class="muted" style="max-width:62ch">${why}</p>
      <div class="money2">
        <div class="mcol"><span class="mini-label">Charged from the hold</span><span class="mbig" style="color:${cap ? 'var(--bad)' : 'var(--ink)'}">${usd(cap ? Z : 0)}</span></div>
        <div class="mcol"><span class="mini-label">Released</span><span class="mbig" style="color:var(--ok)">${usd0(cap ? rest : h.amount)}</span><span class="hint">Can take up to 3 days to show in your account</span></div>
      </div>
      <div class="row"><button class="btn btn-primary" data-go="rental" data-id="${r.id}">View rental</button><button class="btn" data-go="rentals">My rentals</button></div>
    </div>`;

  return `<div class="wrap page narrow">
    <button class="back" data-go="rental" data-id="${r.id}">← ${esc(l.short)}</button>

}
function closeRental(r){
  r.phase = 'returned'; r.returnedOn = iso(TODAY);
  r.hold.released = iso(TODAY);
  r.hold.refreshes = (r.hold.refreshes || []).filter(f => f.state === 'done');
}
function decide(kind, accepted){
  const R = S.ret, r = rent(R.rid), h = r.hold, l = lst(r.lid), C = R.claim;
  closeRental(r);
  if (C.type === 'notreturned' && kind === 'capture') r.notReturned = true;
  if (kind === 'release') { h.status = 'released'; h.reason = 'The claim was reviewed and closed. Nothing was charged.'; }
  else { h.status = 'captured'; h.captured = C.amount; h.reason = `${CLAIM_TYPES[C.type]} claim approved. ${usd0(C.amount)} of the ${usd0(h.amount)} hold was charged${h.amount > C.amount ? ` and the other ${usd0(h.amount - C.amount)} was released` : ''}.`; }
  R.outcome = kind; R.accepted = !!accepted; R.stage = 'decided';
  pushNotif({rid:r.id, tone: kind === 'release' ? 'ok' : 'bad', title: kind === 'release' ? `Your ${usd0(h.amount)} hold has been released` : `Hold captured: ${usd0(C.amount)}`, body:`${l.short} · ${kind === 'release' ? 'claim closed, nothing charged' : 'claim approved'}.`});
  render();
}

  },
  'ret-claim': () => { S.ret.stage = 'claim_form'; S.ret.hadClaim = true; render(); },
  'ret-file': () => { const n = $('#cl-note'); if (n) S.ret.claim.note = n.value; S.ret.stage = 'claim_open'; render(); toast('Claim filed. The hold stays in place. Nothing charged yet.'); },
  'ret-respond': () => { if (S.ret.resp.choice === 'accept') decide('capture', true); else { S.ret.stage = 'review'; render(); } },
  'ret-decide': b => decide(b.dataset.k),
  'toggle-notifs': () => { S.notifOpen = !S.notifOpen; if (S.notifOpen) unread = 0; renderNotifs(); },
  'dash-role': b => { S.dashRole = b.dataset.role; render(); },
  'hold-reset': () => { S.create.touched = false; S.create.hold = null; updateCreate(true); }
};

document.addEventListener('click', e => {
  if (S.notifOpen && !e.target.closest('.notif-panel') && !e.target.closest('#bell')) { S.notifOpen = false; renderNotifs(); }
  document.querySelectorAll('.tip.open').forEach(t => { if (!t.contains(e.target)) t.classList.remove('open'); });
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go, g.dataset); return; }
  const a = e.target.closest('[data-action]');
  if (a && A[a.dataset.action]) A[a.dataset.action](a, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.tip.open').forEach(t => t.classList.remove('open'));
  if (S.notifOpen) { S.notifOpen = false; renderNotifs(); $('#bell').focus(); }
});
document.addEventListener('input', e => {
  const t = e.target, c = S.card;
  switch (t.id) {
    case 'f-q': S.filters.q = t.value; updateGrid(); break;
    case 'f-price': S.filters.maxPrice = +t.value; $('#f-price-v').textContent = 'up to $' + t.value; updateGrid(); break;
    case 'req-msg': S.req.msg = t.value; break;
    case 'cc-num': {
      const d = t.value.replace(/\D/g, '').slice(0, 16), f = fmtCard(d);
      if (t.value !== f) t.value = f;
      c.num = d; c.err = '';
      if (c.status === 'declined') { c.status = 'idle'; }
      $('#cc-err').innerHTML = '';
      const tc = TEST_CARDS[d];
      $('#cc-brand').textContent = tc ? `${tc.brand} ${tc.type}` : '';
      $('#cc-type').innerHTML = cardTypeNotice(tc, (S.view === 'request' ? lst(S.req.lid).hold : rent(S.rentalId).hold.amount));
      break;
    }
    case 'cc-exp': { let d = t.value.replace(/\D/g, '').slice(0, 4); if (d.length > 2) d = d.slice(0, 2) + '/' + d.slice(2); if (t.value !== d && !(e.inputType || '').startsWith('delete')) t.value = d; c.exp = t.value; break; }
    case 'cc-cvc': t.value = t.value.replace(/\D/g, '').slice(0, 4); c.cvc = t.value; break;
    case 'cc-zip': t.value = t.value.replace(/\D/g, '').slice(0, 5); c.zip = t.value; break;
    case 'cc-name': c.name = t.value; break;
    case 'c-name': S.create.name = t.value; updateCreate(false); break;
    case 'c-spot': S.create.spot = t.value; break;
    case 'c-price': S.create.price = +t.value; updateCreate(false); break;
    case 'c-value': { const v = +t.value; if (v > 0) { const before = holdRange(S.create.value).key; S.create.value = v; if (S.create.touched && holdRange(v).key !== before) S.create.touched = false; updateCreate(true); } break; }
    case 'c-hold': S.create.hold = +t.value; S.create.touched = true; updateCreate(false); break;
    case 'cl-amt': S.ret.claim.amount = +t.value; $('#cl-amt-v').textContent = usd0(+t.value); break;
    case 'cl-note': S.ret.claim.note = t.value; break;
    case 'rs-note': S.ret.resp.note = t.value; break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'f-hold') { S.filters.hold = t.value; updateGrid(); }
  if (t.id === 'agree') { S.req.agreed = t.checked; $('#agree-btn').disabled = !t.checked; }
  if (t.id === 'c-cat') { S.create.cat = t.value; updateCreate(false); }
  if (t.id === 'c-cond') { S.create.cond = t.value; updateCreate(false); }
  if (t.name === 'cl-type') { const l = lst(rent(S.ret.rid).lid); S.ret.claim = {type:t.value, ...claimDefaults(t.value, l)}; render(); }
  if (t.name === 'rs-choice') { S.ret.resp.choice = t.value; render(); }
  if (t.id === 'ret-file' && t.files) {
    [...t.files].slice(0, 6).forEach(file => {
      const fr = new FileReader();
      fr.onload = () => { S.ret.after.push({src: fr.result}); render(); };
      fr.readAsDataURL(file);
    });
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'cardform') placeHold(e.target.dataset.ctx);
  if (e.target.id === 'createform') publishListing();
});

/* ---------- boot ---------- */
const h0 = (location.hash || '').slice(1);
if (['browse','rentals','dashboard','create','safety'].includes(h0)) S.view = h0;
render();
</script>
